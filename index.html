<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b0e">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="雨夜山间的木构温泉旅馆：檐下纸灯笼、石板小径、露天汤池与白雾。">
  <title>雨夜 · 山霧湯</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23131b1d'/%3E%3Ccircle cx='32' cy='29' r='15' fill='none' stroke='%23e4b56d' stroke-width='2'/%3E%3Cpath d='M21 34c4-3 7-3 11 0s7 3 11 0' fill='none' stroke='%23e4b56d' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M24 24c2-3 1-6 4-8M32 22c2-3 1-6 4-8M40 24c2-3 1-6 4-8' fill='none' stroke='%23e4b56d' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>:root {
  --bar: clamp(10px, 2.1vh, 24px);
  --edge: clamp(22px, 4.3vw, 68px);
  --ink: #ece3d3;
  --ink-dim: rgba(228, 218, 200, 0.56);
  --ink-faint: rgba(222, 211, 192, 0.34);
  --paper: #e5d6bd;
  --amber: #d7ad73;
  --seal: #8f2b22;
  --ui-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", "Yu Mincho", "SimSun", serif;
  --ui-sans: "Avenir Next", "Helvetica Neue", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #050a0d;
  color: var(--ink);
}

body {
  font-family: var(--ui-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

button {
  font: inherit;
}

::selection {
  background: rgba(181, 80, 48, 0.42);
  color: #fff4e1;
}

.stage {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 70%, rgba(49, 68, 72, 0.22), transparent 58%),
    #050a0d;
  cursor: grab;
  touch-action: none;
}

.stage.is-dragging {
  cursor: grabbing;
}

.stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}

.cinema-bar {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 40;
  height: var(--bar);
  background: #020506;
  pointer-events: none;
}

.cinema-bar--top {
  top: 0;
  border-bottom: 1px solid rgba(207, 191, 163, 0.055);
}

.cinema-bar--bottom {
  bottom: 0;
  border-top: 1px solid rgba(207, 191, 163, 0.045);
}

.edge-shade {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 2;
  pointer-events: none;
}

.edge-shade--top {
  top: 0;
  height: 34vh;
  background: linear-gradient(to bottom, rgba(1, 5, 7, 0.62), rgba(1, 5, 7, 0.12) 55%, transparent);
}

.edge-shade--bottom {
  bottom: 0;
  height: 30vh;
  background: linear-gradient(to top, rgba(1, 5, 7, 0.75), rgba(1, 5, 7, 0.18) 58%, transparent);
}

.masthead {
  position: fixed;
  z-index: 20;
  top: calc(var(--bar) + clamp(24px, 5.2vh, 64px));
  left: var(--edge);
  display: flex;
  align-items: flex-start;
  gap: clamp(14px, 1.6vw, 24px);
  pointer-events: none;
  opacity: 0;
  transform: translateY(9px);
  transition: opacity 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.5s, transform 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.5s;
}

body.is-ready .masthead {
  opacity: 1;
  transform: translateY(0);
}

.seal {
  flex: 0 0 auto;
  width: clamp(35px, 3.5vw, 46px);
  height: clamp(35px, 3.5vw, 46px);
  display: grid;
  place-items: center;
  margin-top: 2px;
  color: rgba(250, 225, 199, 0.88);
  font-family: "KaiTi", "STKaiti", "Yu Mincho", serif;
  font-size: clamp(23px, 2.25vw, 29px);
  line-height: 1;
  background:
    linear-gradient(145deg, rgba(151, 49, 38, 0.92), rgba(101, 31, 27, 0.88)),
    #8e2e26;
  border: 1px solid rgba(222, 175, 146, 0.32);
  box-shadow:
    inset 0 0 0 3px rgba(61, 16, 13, 0.24),
    0 2px 16px rgba(0, 0, 0, 0.34);
  transform: rotate(-2.5deg);
  opacity: 0.94;
}

.masthead__copy {
  min-width: 0;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1px 0 clamp(9px, 1.3vh, 14px);
  color: rgba(226, 218, 203, 0.6);
  font-family: var(--ui-sans);
  font-size: clamp(7.5px, 0.62vw, 10px);
  letter-spacing: 0.31em;
  line-height: 1.4;
  white-space: nowrap;
}

.eyebrow__line {
  display: inline-block;
  width: clamp(20px, 2.5vw, 38px);
  height: 1px;
  background: linear-gradient(to right, rgba(213, 188, 155, 0.64), rgba(213, 188, 155, 0.06));
}

h1 {
  margin: 0;
  color: rgba(240, 231, 216, 0.95);
  font-family: var(--ui-serif);
  font-size: clamp(27px, 2.55vw, 42px);
  font-weight: 500;
  letter-spacing: 0.18em;
  line-height: 1.16;
  white-space: nowrap;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
}

.subline {
  margin: clamp(9px, 1.35vh, 14px) 0 0;
  color: rgba(226, 214, 195, 0.66);
  font-family: var(--ui-serif);
  font-size: clamp(9px, 0.75vw, 11px);
  letter-spacing: 0.26em;
  white-space: nowrap;
}

.subline span {
  display: inline-block;
  padding: 0 0.3em;
  color: rgba(201, 168, 123, 0.6);
}

.conditions {
  position: fixed;
  z-index: 20;
  top: calc(var(--bar) + clamp(25px, 5.2vh, 65px));
  right: var(--edge);
  display: flex;
  align-items: center;
  gap: 13px;
  color: rgba(228, 219, 202, 0.58);
  font-family: var(--ui-sans);
  font-size: 9px;
  letter-spacing: 0.22em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.8s ease 1.1s;
}

body.is-ready .conditions {
  opacity: 1;
}

.conditions__rain {
  color: rgba(211, 197, 172, 0.72);
  font-family: var(--ui-serif);
  font-size: 17px;
  letter-spacing: 0;
}

.conditions__rule {
  width: 26px;
  height: 1px;
  background: rgba(218, 205, 184, 0.18);
}

.conditions__time {
  color: rgba(237, 227, 209, 0.75);
  font-variant-numeric: tabular-nums;
}

.conditions__temp {
  color: rgba(218, 205, 184, 0.38);
}

.footer {
  position: fixed;
  z-index: 20;
  left: var(--edge);
  bottom: calc(var(--bar) + clamp(24px, 4.8vh, 49px));
  display: flex;
  flex-direction: column;
  gap: 16px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(7px);
  transition: opacity 1.8s ease 1s, transform 1.8s ease 1s;
}

body.is-ready .footer {
  opacity: 1;
  transform: translateY(0);
}

.place {
  display: flex;
  align-items: flex-start;
  gap: 13px;
}

.place__rule {
  display: block;
  width: 1px;
  height: 31px;
  margin-top: 2px;
  background: linear-gradient(to bottom, rgba(213, 186, 149, 0.62), rgba(213, 186, 149, 0.04));
}

.place__name {
  margin: 0;
  color: rgba(238, 227, 209, 0.85);
  font-size: 11px;
  letter-spacing: 0.3em;
}

.place__en {
  margin: 6px 0 0;
  color: rgba(213, 201, 181, 0.41);
  font-family: var(--ui-sans);
  font-size: 7px;
  letter-spacing: 0.34em;
}

.hint-line {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  padding-left: 14px;
  color: rgba(221, 209, 190, 0.5);
  font-family: var(--ui-serif);
  font-size: 9px;
  letter-spacing: 0.18em;
  transition: opacity 1.4s ease, transform 1.4s ease;
}

.hint-line__key {
  color: rgba(228, 214, 193, 0.66);
}

.hint-line i {
  display: block;
  width: 15px;
  height: 1px;
  margin: 0 3px;
  background: rgba(199, 182, 158, 0.25);
}

body.has-interacted .hint-line,
body.hint-quiet .hint-line {
  opacity: 0;
  transform: translateY(3px);
}

.controls {
  position: fixed;
  z-index: 22;
  right: var(--edge);
  bottom: calc(var(--bar) + clamp(24px, 4.8vh, 49px));
  display: flex;
  align-items: center;
  gap: 15px;
  opacity: 0;
  transition: opacity 1.8s ease 1.15s;
}

body.is-ready .controls {
  opacity: 1;
}

.controls__state {
  color: rgba(209, 195, 173, 0.29);
  font-family: var(--ui-sans);
  font-size: 7px;
  letter-spacing: 0.3em;
}

.control-button {
  pointer-events: auto;
  -webkit-appearance: none;
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 38px;
  padding: 0 15px 0 12px;
  color: rgba(232, 222, 205, 0.76);
  background: rgba(9, 15, 17, 0.33);
  border: 1px solid rgba(222, 202, 170, 0.16);
  border-radius: 999px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
}

.control-button:hover {
  color: rgba(246, 235, 217, 0.96);
  background: rgba(18, 26, 27, 0.5);
  border-color: rgba(224, 198, 158, 0.34);
}

.control-button:focus-visible {
  outline: 1px solid rgba(230, 197, 144, 0.74);
  outline-offset: 4px;
}

.control-button__icon {
  display: grid;
  place-items: center;
  width: 19px;
  height: 19px;
  color: rgba(229, 195, 143, 0.72);
}

.control-button__icon svg {
  width: 19px;
  height: 19px;
  animation: orbit-icon 9s linear infinite;
}

.control-button.is-paused .control-button__icon svg {
  animation-play-state: paused;
  opacity: 0.62;
}

.control-button__label {
  font-size: 9px;
  letter-spacing: 0.2em;
}

@keyframes orbit-icon {
  to {
    transform: rotate(360deg);
  }
}

.loader {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 47%, #0b1518 0%, #060b0e 48%, #030607 100%);
  transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s;
}

body.is-ready .loader {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader.is-error {
  display: none;
}

.loader__veil {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 78%, rgba(113, 72, 36, 0.07), transparent 48%),
    linear-gradient(to bottom, transparent 45%, rgba(2, 5, 6, 0.26));
  pointer-events: none;
}

.loader__content {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-2vh);
}

.loader__seal {
  color: rgba(205, 186, 158, 0.46);
  font-family: "KaiTi", "STKaiti", "Yu Mincho", serif;
  font-size: clamp(22px, 2.2vw, 30px);
  letter-spacing: 0.34em;
  padding-left: 0.34em;
  margin-bottom: clamp(20px, 3.2vh, 32px);
}

.loader__title {
  margin: 0;
  color: rgba(230, 218, 198, 0.62);
  font-size: clamp(10px, 0.9vw, 12px);
  letter-spacing: 0.4em;
  padding-left: 0.4em;
}

.loader__line {
  width: clamp(94px, 9vw, 132px);
  height: 1px;
  margin: clamp(20px, 3vh, 27px) 0;
  overflow: hidden;
  background: rgba(219, 196, 163, 0.1);
}

.loader__line span {
  display: block;
  width: 42%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(219, 180, 125, 0.75), transparent);
  animation: loader-sweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.loader__note {
  margin: 0;
  color: rgba(190, 177, 158, 0.3);
  font-size: 9px;
  letter-spacing: 0.26em;
  padding-left: 0.26em;
}

@keyframes loader-sweep {
  0% {
    transform: translateX(-110%);
    opacity: 0;
  }
  22% {
    opacity: 1;
  }
  78% {
    opacity: 1;
  }
  100% {
    transform: translateX(340%);
    opacity: 0;
  }
}

.error-panel {
  position: fixed;
  z-index: 80;
  top: 50%;
  left: 50%;
  width: min(420px, calc(100vw - 48px));
  padding: 28px 30px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(204, 173, 134, 0.2);
  background: rgba(8, 14, 16, 0.94);
  color: rgba(233, 221, 202, 0.8);
  text-align: center;
  backdrop-filter: blur(16px);
}

.error-panel p {
  margin: 0 0 10px;
  font-size: 15px;
  letter-spacing: 0.12em;
}

.error-panel small {
  color: rgba(220, 206, 187, 0.44);
  font-size: 10px;
  letter-spacing: 0.08em;
  line-height: 1.8;
}

.debug {
  position: fixed;
  z-index: 70;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  padding: 6px 12px;
  color: rgba(206, 225, 226, 0.68);
  background: rgba(2, 7, 8, 0.62);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 9px;
  letter-spacing: 0.05em;
  white-space: nowrap;
  pointer-events: none;
}

@media (max-width: 760px) {
  :root {
    --edge: 20px;
  }

  .masthead {
    top: calc(var(--bar) + 22px);
    gap: 12px;
  }

  .seal {
    width: 34px;
    height: 34px;
    font-size: 22px;
  }

  .eyebrow {
    font-size: 6.5px;
    letter-spacing: 0.2em;
    margin-bottom: 7px;
  }

  .eyebrow__line {
    display: none;
  }

  h1 {
    font-size: clamp(23px, 6vw, 30px);
    letter-spacing: 0.13em;
  }

  .subline {
    margin-top: 8px;
    font-size: 8px;
    letter-spacing: 0.16em;
  }

  .conditions {
    display: none;
  }

  .footer {
    bottom: calc(var(--bar) + 22px);
    gap: 13px;
  }

  .place__name {
    font-size: 9px;
    letter-spacing: 0.23em;
  }

  .place__en {
    font-size: 6px;
    letter-spacing: 0.2em;
  }

  .hint-line {
    padding-left: 14px;
    font-size: 8px;
    letter-spacing: 0.1em;
  }

  .controls {
    bottom: calc(var(--bar) + 22px);
    right: 18px;
  }

  .controls__state {
    display: none;
  }

  .control-button {
    height: 35px;
    padding: 0 12px 0 10px;
    gap: 7px;
  }

  .control-button__label {
    font-size: 8px;
    letter-spacing: 0.14em;
  }

  .loader__note {
    font-size: 8px;
  }
}

@media (max-width: 430px) {
  .hint-line {
    display: none;
  }

  .place__rule {
    height: 26px;
  }

  .subline span:nth-of-type(2) {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .masthead,
  .footer,
  .conditions,
  .controls {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>
<body>
  <main id="stage" class="stage" aria-label="雨夜山间温泉三维场景"></main>

  <div class="cinema-bar cinema-bar--top" aria-hidden="true"></div>
  <div class="cinema-bar cinema-bar--bottom" aria-hidden="true"></div>
  <div class="edge-shade edge-shade--top" aria-hidden="true"></div>
  <div class="edge-shade edge-shade--bottom" aria-hidden="true"></div>

  <header class="masthead">
    <div class="seal" aria-hidden="true">湯</div>
    <div class="masthead__copy">
      <p class="eyebrow"><span class="eyebrow__line"></span>A RAIN-SOAKED NIGHT IN THE MOUNTAINS</p>
      <h1>雨夜 · 山霧湯</h1>
      <p class="subline">木构汤屋 <span>·</span> 露天风吕 <span>·</span> 山雾入夜</p>
    </div>
  </header>

  <div class="conditions" aria-hidden="true">
    <span class="conditions__rain">雨</span>
    <span class="conditions__rule"></span>
    <span class="conditions__time">23:41</span>
    <span class="conditions__temp">8°C</span>
  </div>

  <footer class="footer">
    <div class="place">
      <span class="place__rule" aria-hidden="true"></span>
      <div>
        <p class="place__name">山霧温泉旅館</p>
        <p class="place__en">SANMU ONSEN RYOKAN</p>
      </div>
    </div>
    <p class="hint-line"><span class="hint-line__key">拖动</span> 环视山庭 <i></i> <span class="hint-line__key">滚轮</span> 远近</p>
  </footer>

  <div class="controls">
    <span class="controls__state" aria-hidden="true">SLOW ORBIT</span>
    <button id="orbit-toggle" class="control-button" type="button" aria-pressed="true" title="暂停或继续自动环视">
      <span class="control-button__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.3" opacity=".45"/>
          <path d="M12 3.8a8.2 8.2 0 0 1 8.2 8.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="18.3" cy="7.6" r="1.6" fill="currentColor"/>
        </svg>
      </span>
      <span id="orbit-label" class="control-button__label">环视中</span>
    </button>
  </div>

  <section id="loader" class="loader" aria-label="正在加载场景">
    <div class="loader__veil"></div>
    <div class="loader__content">
      <span class="loader__seal" aria-hidden="true">山霧</span>
      <p class="loader__title">雨夜 · 山間の湯</p>
      <div class="loader__line"><span></span></div>
      <p class="loader__note">檐雨初落，汤烟渐起</p>
    </div>
  </section>

  <section id="webgl-error" class="error-panel" hidden>
    <p>场景初始化失败</p>
    <small>请尝试使用支持 WebGL2 的现代浏览器重新打开。</small>
  </section>

  <div id="debug" class="debug" hidden></div>
  <noscript>
